<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Time Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>My Time Manager</h1>

        <section class="game-card">

            <h2>🎮 Game Time</h2>

            <div id="game-time">
                00:00
            </div>

            <div class="buttons">
                <button id="add-time">
                    +1 phút
                </button>

                <button id="remove-time">
                    -1 phút
                </button>
            </div>

        </section>
        <section class="item-card">
            <h2>📚 Rewrite Tiếng Anh</h2>

            <p>1 câu = 1 phút game time</p>
            <p>Đã làm:
                <span id="rewrite-count">0</span> / 20
            </p>
            <button id="rewrite-button">
                Hoàn thành 1 câu
            </button>
        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
